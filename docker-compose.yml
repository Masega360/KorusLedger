name: korus-ledger

services:
  postgres:
    image: postgres:16
    container_name: korus-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: korus_db
    ports:
      - "5432:5432"
    volumes:
      - korus-pg-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  korus-pg-data:
    name: korus-pg-data